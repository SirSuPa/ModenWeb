<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hyperlink</title>
</head>
<body>
    <!-- โครงสร้างพื้นฐานของ link-->
    <p><a href="URL">ข้อความ</a></p>
    <!-- ลิงก์ไปยังเว็บอื่น-->
     <p><a href="https://www.googld.com">ไป google</a></p>
     <!-- ลิงก์ไปยังหน้าเว็บไซต์อื่น-->
      <p><a href="index.html">ไป list.html</a></p>
      <!-- ลิงก์ไปยังส่วนหนึ่งของหน้าเดียวกัน (bookmark / anchor)-->
       <p>
        <h2 id="contact">เมนูติดต่อเรา</h2>
        <a href="#contact">ไปส่วนติดต่อเรา</a>
       </p>
       <!-- เปลิดลิงก์ในแท็ปใหม่-->
        <p><a href="https:/example.com" target="_blank">เปิดในแท็ปใหม่--</a></p>
       <!-- ลิงก์ส่งอีเมล-->
        <p><a href="noteggwpez@gmail.com">ส่งอีเมล</a></p>
        <!-- ลิงก์เบอร์มือถือ-->
         <p><a href="tel:0989996938">โทรเลย</a></p>
</body>
</html>
