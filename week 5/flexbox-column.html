<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox-column</title>
    <link rel="stylesheet" href="flexbox-column.css">
</head>
<body>
    <h2>1) justifu-content: center (จัดลูกให้อยู่กลาง "แนวตั้ง")</h2>
    <div class="flexbox" style="justify-content: center;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

    <h2>2) justifu-content: space-between (กระจายบน-ล่าง)</h2>
    <div class="flexbox" style="justify-content: space-between;">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item"><Canvas></Canvas></div>
    </div>

    <h2>3) align-item: center (ลูกอยู่กึ่งกลาง "แนวนอน")</h2>
    <div class="flexbox" style="align-items: center;">
        <div class="item" style="width: 60px;">X</div>
        <div class="item" style="width: 80px;">Y</div>
        <div class="item" style="width: 40px;">Z</div>
    </div>

    <h2>4) align-item: stretch (ลูกถูกยึดเต็มความกว้างแนวนอน)</h2>
    <div class="flexbox-box stretch" style="align-items: stretch;">
        <div class="item">One</div>
        <div class="item">Two</div>
        <div class="item">Three</div>
    </div>
</body>
</html>
