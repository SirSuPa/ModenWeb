<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <link rel="stylesheet" href="flexbox-row.css">
</head>
<body>

    <h2>1) justifu-content: centure</h2>
    <div class="flexbox" style="justify-content: center;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

    <h2>2) justifu-content: space-between</h2>
    <div class="flexbox" style="justify-content: space-between;">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>

    <h2>3) align-item: center (จัดตรงกลางแนวตั้ง)</h2>
    <div class="flexbox" style="align-items: center;">
        <div class="item" style="height: 40px;">1</div>
        <div class="item" style="height: 80px;">2</div>
        <div class="item" style="height: 60px;">3</div>
    </div>

    <h2>4) align-item: stretch (ลูกถูกยืดให้เท่ากัน)</h2>
    <div class="flexbox stretch" style="align-items: stretch;">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
