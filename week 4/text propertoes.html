<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text properties</title>
</head>
<style>
    .text-align{
        text-align: center;
    }
    .text-decoration{
        text-decoration: underline;
    }
    .line-height{
        line-height: 1.5px;
    }
</style>
<body>
    <p class="text-align">center</p>
    <p class="text-decoration">decoration</p>
    <p class="line-height">line height</p>
</body>
</html>
